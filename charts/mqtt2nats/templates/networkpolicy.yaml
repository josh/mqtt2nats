{{- /*
The bridge is outbound-only apart from kubelet probes: it dials DNS, the MQTT
broker, and NATS, and serves /healthz and /readyz on the http port. The checks
below fail rendering rather than deploying a bridge that cannot reach one of
its two endpoints, which would otherwise surface only as a 503 on /readyz.
*/ -}}
{{- if .Values.networkPolicy.egress.enabled }}
{{- $extra := .Values.networkPolicy.egress.extraRules }}
{{- if not (or .Values.networkPolicy.egress.mqtt.to $extra) }}
{{- fail "mqtt2nats: networkPolicy.egress.enabled needs peers reaching config.mqtt.broker_url; set networkPolicy.egress.mqtt.to" }}
{{- end }}
{{- if not (or .Values.networkPolicy.egress.nats.to $extra) }}
{{- fail "mqtt2nats: networkPolicy.egress.enabled needs peers reaching config.nats.url; set networkPolicy.egress.nats.to" }}
{{- end }}
{{- end }}
{{- if .Values.networkPolicy.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-ingress" (include "mqtt2nats.fullname" .) }}
  labels:
    {{- include "mqtt2nats.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mqtt2nats.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- with .Values.networkPolicy.ingress.from }}
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: http
  {{- else }}
  # Nothing needs to reach the bridge. Kubelet probes are node-local traffic,
  # which most CNIs exempt from pod policy -- confirm against yours, since a
  # blocked probe restarts the pod on liveness failure.
  ingress: []
  {{- end }}
{{- end }}
{{- if and .Values.networkPolicy.ingress.enabled .Values.networkPolicy.egress.enabled }}
---
{{- end }}
{{- if .Values.networkPolicy.egress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-egress" (include "mqtt2nats.fullname" .) }}
  labels:
    {{- include "mqtt2nats.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mqtt2nats.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # Always present: neither config.mqtt.broker_url nor config.nats.url can be
    # resolved without it. Destination-agnostic unless dnsTo names the resolvers.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
      {{- with .Values.networkPolicy.egress.dnsTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.networkPolicy.egress.mqtt.to }}
    # The broker behind config.mqtt.broker_url.
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.networkPolicy.egress.mqtt.port | int }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.nats.to }}
    # The NATS server behind config.nats.url.
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.networkPolicy.egress.nats.port | int }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
